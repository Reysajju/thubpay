<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none">
  <defs>
    <!-- Background glow filter -->
    <filter id="emerald-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="50%" stop-color="#00D9F5" />
      <stop offset="100%" stop-color="#00B894" />
    </linearGradient>

    <linearGradient id="shield-inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#003B2B" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="100%" stop-color="#00D9F5" />
    </linearGradient>
  </defs>

  <!-- ── 1. Icon Badge (Left) ── -->
  <g transform="translate(15, 12)">
    <!-- Outer Shield Glow Outline -->
    <path d="M48 6 L86 20 L86 52 C86 74 69 92 48 98 C27 92 10 74 10 52 L10 20 Z" 
          fill="url(#shield-inner)" 
          stroke="url(#shield-grad)" 
          stroke-width="4.5" 
          stroke-linejoin="round"
          filter="url(#emerald-glow)" />

    <!-- Stylized Geometric "T" -->
    <!-- Top bar -->
    <path d="M26 34 L70 34 L62 45 L53 45 L53 82 L43 82 L43 45 L34 45 Z" 
          fill="#FFFFFF" />
    
    <!-- Cyber Accent Edge on T -->
    <path d="M48 45 L48 80" 
          stroke="#00F5A0" 
          stroke-width="2.5" 
          stroke-linecap="round" />
  </g>

  <!-- ── 2. Brand Typography ── -->
  <text x="135" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
    <tspan fill="#FFFFFF">THUB</tspan>
    <tspan fill="url(#text-grad)">PAY</tspan>
  </text>
  <text x="137" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="3.5" fill="#71717A">
    PAYMENT PLATFORM
  </text>
</svg>
